<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish It — Secret Chance Calculator</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      margin: 0;
    }
    h1 {
      color: #00bfff;
      margin-bottom: 20px;
      text-align: center;
      text-shadow: 0 0 10px rgba(0,191,255,0.6);
    }
    .container {
      background-color: #1a1a1a;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 191, 255, 0.25);
      max-width: 800px;
      width: 100%;
    }
    label {
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
      color: #a8a8a8;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: none;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      text-align: center;
    }
    button {
      background-color: #00bfff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0099cc;
    }
    .profile {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }
    .profile img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid #00bfff;
    }
    .table-container {
      max-height: 400px;
      overflow-y: auto;
      border-radius: 8px;
      margin-top: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #111;
      color: #00bfff;
      cursor: pointer;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    tr:nth-child(even) {
      background-color: #151515;
    }
    tr:nth-child(odd) {
      background-color: #1e1e1e;
    }
    .footer {
      margin-top: 20px;
      color: #555;
      font-size: 0.9rem;
      text-align: center;
    }
    /* Modal Styling */
    .modal-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0,191,255,0.3);
      width: 90%;
      max-width: 400px;
    }
    .modal h2 {
      color: #00bfff;
      margin-bottom: 10px;
    }
    .modal p {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }
    .modal input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #2a2a2a;
      color: white;
      text-align: center;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <!-- Modal Popup Username -->
  <div class="modal-bg" id="usernameModal">
    <div class="modal">
      <h2>Masukkan Username Roblox</h2>
      <p>Tanpa menggunakan @</p>
      <input type="text" id="usernameInput" placeholder="Contoh: Builderman">
      <button onclick="saveUsername()">Lanjut</button>
    </div>
  </div>

  <h1>🎣 Fish It Secret Chance Calculator</h1>

  <div class="container" id="mainContainer" style="display:none;">
    <div class="profile">
      <img id="avatar" src="" alt="Avatar">
      <div>
        <div id="robloxName"></div>
        <a id="robloxProfile" href="#" target="_blank" style="color:#00bfff;text-decoration:none;">Lihat Profil Roblox</a>
      </div>
    </div>

    <label for="luckInput">Masukkan Luck (%)</label>
    <input type="number" id="luckInput" placeholder="Contoh: 100" min="1" value="100">
    <button onclick="calculateChances()">Hitung Peluang</button>

    <div class="table-container">
      <table id="resultTable">
        <thead>
          <tr>
            <th onclick="sortTable(0)">Nama Ikan</th>
            <th onclick="sortTable(1)">Lokasi</th>
            <th onclick="sortTable(2)">Base Chance</th>
            <th onclick="sortTable(3)">Final Chance (%)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="footer">Made with ❤️ for Fish It players</div>

  <script>
    const fishList = [
      {name:"Eerie Shark", location:"Coral Reefs", base:250000},
      {name:"Blob Shark", location:"Ocean", base:250000},
      {name:"Ghost Shark", location:"Ocean", base:500000},
      {name:"Crystal Crab", location:"Fisherman Island", base:750000},
      {name:"Queen Crab", location:"Treasure Room (Lost Isle)", base:800000},
      {name:"Kraken", location:"Treasure Room & Sisyphus Statue", base:800000},
      {name:"Great Whale", location:"Tropical Grove", base:900000},
      {name:"King Crab", location:"Treasure Room (Lost Isle)", base:1200000},
      {name:"Giant Squid", location:"Treasure Room / Sisyphus", base:1200000},
      {name:"Orca", location:"Fisherman Island", base:1500000},
      {name:"King Jelly", location:"Acient Jungle", base:1500000},
      {name:"Monster Shark", location:"Coral Reefs", base:2500000},
      {name:"Worm Fish", location:"Ocean", base:3000000},
      {name:"Robot Kraken", location:"Sisyphus Statue (Lost Isle)", base:3500000},
      {name:"Megalodon", location:"Ocean", base:4000000},
      {name:"Zombie Megalodon", location:"Hollow Island", base:4000000},
      {name:"ElShark Gran Maja", location:"Ocean", base:4000000},
      {name:"Frostborn Shark", location:"Crater Island", base:5000000}
    ];

    const defaultAvatar = "https://tr.rbxcdn.com/30DAY-AvatarHeadshot-420x420.png";

    function saveUsername() {
      const username = document.getElementById("usernameInput").value.trim();
      if (!username) {
        alert("Masukkan username Roblox terlebih dahulu!");
        return;
      }

      document.getElementById("usernameModal").style.display = "none";
      document.getElementById("mainContainer").style.display = "block";
      loadRobloxProfile(username);
    }

    async function loadRobloxProfile(username) {
      try {
        const res = await fetch(`https://users.roblox.com/v1/usernames/users`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({usernames: [username]})
        });
        const data = await res.json();
        if (data.data && data.data.length > 0) {
          const user = data.data[0];
          const userId = user.id;
          const avatarRes = await fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=true`);
          const avatarData = await avatarRes.json();
          const avatarUrl = avatarData.data?.[0]?.imageUrl || defaultAvatar;
          document.getElementById("avatar").src = avatarUrl;
          document.getElementById("robloxName").innerText = username;
          document.getElementById("robloxProfile").href = `https://www.roblox.com/users/${userId}/profile`;
        } else throw new Error("Not found");
      } catch (e) {
        document.getElementById("avatar").src = defaultAvatar;
        document.getElementById("robloxName").innerText = username + " (Guest)";
        document.getElementById("robloxProfile").href = `https://www.roblox.com/search/users?keyword=${username}`;
      }
    }

    function calculateChances() {
      const luck = parseFloat(document.getElementById("luckInput").value);
      const tableBody = document.querySelector("#resultTable tbody");
      tableBody.innerHTML = "";
      if (isNaN(luck) || luck <= 0) {
        alert("Masukkan nilai luck yang valid!");
        return;
      }
      fishList.forEach(fish => {
        const finalRate = (1 / (fish.base / (luck / 100))) * 100;
        const row = `
          <tr>
            <td>${fish.name}</td>
            <td>${fish.location}</td>
            <td>1 / ${fish.base.toLocaleString()}</td>
            <td>${finalRate.toFixed(6)}%</td>
          </tr>`;
        tableBody.innerHTML += row;
      });
    }

    function sortTable(n) {
      const table = document.getElementById("resultTable");
      let switching = true, dir = "asc", switchcount = 0;
      while (switching) {
        switching = false;
        const rows = table.rows;
        for (let i = 1; i < (rows.length - 1); i++) {
          let shouldSwitch = false;
          const x = rows[i].getElementsByTagName("TD")[n];
          const y = rows[i + 1].getElementsByTagName("TD")[n];
          if (dir === "asc" && x.innerHTML.toLowerCase() > y.innerHTML.toLowerCase()) {
            shouldSwitch = true; break;
          } else if (dir === "desc" && x.innerHTML.toLowerCase() < y.innerHTML.toLowerCase()) {
            shouldSwitch = true; break;
          }
        if (shouldSwitch) {
            rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
            switching = true;
            switchcount++;
          } else {
            if (switchcount === 0 && dir === "asc") {
              dir = "desc";
              switching = true;
            }
          }
        }
      }
    }
  </script>
</body>
</html>
