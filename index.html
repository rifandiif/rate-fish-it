<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish It Secret Chance Calculator</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      color: #00bfff;
      margin-bottom: 20px;
      text-align: center;
    }

    .container {
      background-color: #1a1a1a;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 191, 255, 0.2);
      max-width: 700px;
      width: 100%;
    }

    label {
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
      color: #a8a8a8;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: none;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #111;
      color: #00bfff;
    }

    tr:nth-child(even) {
      background-color: #151515;
    }

    tr:nth-child(odd) {
      background-color: #1e1e1e;
    }

    .footer {
      margin-top: 20px;
      color: #555;
      font-size: 0.9rem;
      text-align: center;
    }

    button {
      background-color: #00bfff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      transition: 0.3s;
    }

    button:hover {
      background-color: #0099cc;
    }
  </style>
</head>
<body>

  <h1>🎣 Fish It Secret Chance Calculator</h1>

  <div class="container">
    <label for="luckInput">Masukkan Luck (%)</label>
    <input type="number" id="luckInput" placeholder="Contoh: 100" min="1" value="100">
    <button onclick="calculateChances()">Hitung Peluang</button>

    <table id="resultTable">
      <thead>
        <tr>
          <th>Nama Ikan</th>
          <th>Lokasi</th>
          <th>Base Chance</th>
          <th>Final Chance (%)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="footer">Made with ❤️ for Fish It players</div>

  <script>
    const fishList = [
      { name: "King Crab", location: "Treasure Room", base: 1200000 },
      { name: "Queen Crab", location: "Treasure Room", base: 800000 },
      { name: "Kraken", location: "Treasure Room & Sisyphus Statue", base: 800000 },
      { name: "Robot Kraken", location: "Sisyphus Statue", base: 3500000 },
      { name: "Orca", location: "Fisherman Island", base: 1500000 },
      { name: "Crystal Crab", location: "Fisherman Island", base: 750000 },
      { name: "Monster Shark", location: "Coral Reefs", base: 2500000 },
      { name: "Eerie Shark", location: "Coral Reefs", base: 250000 },
      { name: "Great Whale", location: "Tropical Grove", base: 900000 },
    ];

    function calculateChances() {
      const luck = parseFloat(document.getElementById("luckInput").value);
      const tableBody = document.querySelector("#resultTable tbody");
      tableBody.innerHTML = "";

      if (isNaN(luck) || luck <= 0) {
        alert("Masukkan nilai luck yang valid!");
        return;
      }

      fishList.forEach(fish => {
        const finalRate = (1 / (fish.base / (luck / 100))) * 100;
        const row = `
          <tr>
            <td>${fish.name}</td>
            <td>${fish.location}</td>
            <td>1 / ${fish.base.toLocaleString()}</td>
            <td>${finalRate.toExponential(6)}%</td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });
    }

    calculateChances();
  </script>

</body>
</html>
